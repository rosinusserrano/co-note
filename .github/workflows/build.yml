name: CI

# Type-check and build the web app, and build the Android APK.
#
# The two jobs are independent on purpose: a type error shouldn't hide an APK
# that no longer builds, or the other way round.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Check and build web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20: Vite is pinned to ^5 for the local Node 20 (see CLAUDE.md).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The APK is a Trusted Web Activity (android/, generated by Bubblewrap): a
  # thin Android shell that opens https://conote.sniggles.de in Chrome without
  # browser UI. It ships no copy of the app, so web deploys reach it without a
  # new APK; rebuild only when android/ changes (name, icon, colours).
  #
  # Signing: the release key lives outside this public repo, in two secrets:
  #   ANDROID_KEYSTORE_BASE64    base64 of the PKCS#12 keystore (alias "conote")
  #   ANDROID_KEYSTORE_PASSWORD  its password
  # Its SHA-256 is in static/.well-known/assetlinks.json; that match is what
  # removes the URL bar. Without the secrets the job signs with a throwaway
  # key: the APK still works, but shows a URL bar and can't be installed over a
  # build signed with the other key.
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 8.9 needs JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.p12"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: signing with a throwaway key (the app will show a URL bar)."
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias conote \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=conote throwaway" \
              -storepass "$PW" -keypass "$PW"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "conote-${{ github.run_number }}.apk"
          keytool -printcert -jarfile "conote-${{ github.run_number }}.apk" | grep -i 'SHA256:' || true

      - uses: actions/upload-artifact@v4
        with:
          name: conote-apk
          path: conote-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      # Tagged builds get a permanent download link (artifacts expire).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: conote-${{ github.run_number }}.apk
